<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap the Target</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #141e30, #243b55);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: min(90%, 700px);
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #00e5ff;
      margin-top: 0;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 1.2rem;
    }

    #game-area {
      position: relative;
      height: 350px;
      background: #101820;
      border: 3px solid #00e5ff;
      border-radius: 15px;
      overflow: hidden;
    }

    #target {
      display: none;
      position: absolute;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #ff4081;
      cursor: pointer;
      box-shadow: 0 0 20px #ff4081;
    }

    #target:hover {
      transform: scale(1.1);
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #00e5ff;
      color: #001f25;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #76f3ff;
    }

    #message {
      margin: 15px 0;
      color: #d7faff;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🎯 Tap the Target</h1>
    <p>Click the target as many times as possible before time runs out!</p>

    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Time: <span id="time">20</span>s</div>
    </div>

    <div id="game-area">
      <button id="target" aria-label="Target"></button>
    </div>

    <p id="message">Press Start Game to begin.</p>
    <button id="start-button">Start Game</button>
  </main>

  <script>
    const gameArea = document.getElementById("game-area");
    const target = document.getElementById("target");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const message = document.getElementById("message");
    const startButton = document.getElementById("start-button");

    let score = 0;
    let timeLeft = 20;
    let gameTimer;
    let gameRunning = false;

    function moveTarget() {
      const maxX = gameArea.clientWidth - target.offsetWidth;
      const maxY = gameArea.clientHeight - target.offsetHeight;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      target.style.left = randomX + "px";
      target.style.top = randomY + "px";
    }

    function startGame() {
      score = 0;
      timeLeft = 20;
      gameRunning = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      message.textContent = "Quick! Click the target!";
      startButton.textContent = "Restart Game";
      target.style.display = "block";

      moveTarget();

      clearInterval(gameTimer);
      gameTimer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameRunning = false;
      clearInterval(gameTimer);
      target.style.display = "none";
      message.textContent = `Game over! Your final score was ${score}.`;
    }

    target.addEventListener("click", () => {
      if (!gameRunning) return;

      score++;
      scoreDisplay.textContent = score;
      moveTarget();
    });

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
