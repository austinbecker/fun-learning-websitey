<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Defender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #070b18;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #00e5ff;
      margin: 25px 0 8px;
    }

    p {
      color: #aeb8d8;
    }

    #game {
      background:
        radial-gradient(circle, #263b72, #0b1228 65%, #050710);
      border: 2px solid #00e5ff;
      border-radius: 12px;
      height: 500px;
      margin: 25px auto;
      max-width: 850px;
      overflow: hidden;
      position: relative;
    }

    #ship {
      bottom: 20px;
      color: #ff3cac;
      font-size: 45px;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
    }

    .enemy {
      color: #ff4747;
      cursor: pointer;
      font-size: 34px;
      position: absolute;
      user-select: none;
    }

    #score {
      color: #27e882;
      font-size: 1.2rem;
      font-weight: bold;
    }

    button,
    a {
      background: #9147ff;
      border: 0;
      border-radius: 7px;
      color: white;
      cursor: pointer;
      display: inline-block;
      font-size: 1rem;
      padding: 12px 20px;
      text-decoration: none;
    }

    button:hover,
    a:hover {
      background: #ff3cac;
    }
  </style>
</head>

<body>
  <h1>🚀 Space Defender</h1>
  <p>Click the falling enemies before they reach your ship.</p>
  <div id="score">Score: 0</div>

  <div id="game">
    <div id="ship">🚀</div>
  </div>

  <button onclick="startGame()">Start Game</button>
  <a href="../index.html">Back to Games</a>

  <script>
    let score = 0;
    let gameRunning = false;
    let enemyTimer;

    const game = document.getElementById("game");
    const scoreText = document.getElementById("score");

    function startGame() {
      score = 0;
      gameRunning = true;
      scoreText.textContent = "Score: 0";

      document.querySelectorAll(".enemy").forEach(function(enemy) {
        enemy.remove();
      });

      clearInterval(enemyTimer);
      enemyTimer = setInterval(createEnemy, 900);
    }

    function createEnemy() {
      if (!gameRunning) {
        return;
      }

      const enemy = document.createElement("div");
      enemy.className = "enemy";
      enemy.textContent = "☄️";

      enemy.style.left = Math.random() * 90 + "%";
      enemy.style.top = "-40px";

      game.appendChild(enemy);

      let position = -40;

      const fall = setInterval(function() {
        position += 4;
        enemy.style.top = position + "px";

        if (position > game.clientHeight - 65) {
          clearInterval(fall);
          enemy.remove();
          endGame();
        }
      }, 35);

      enemy.addEventListener("click", function() {
        score++;
        scoreText.textContent = "Score: " + score;
        clearInterval(fall);
        enemy.remove();
      });
    }

    function endGame() {
      if (!gameRunning) {
        return;
      }

      gameRunning = false;
      clearInterval(enemyTimer);

      alert("Game over! Your score was " + score + ".");
    }
  </script>
</body>
</html>
